name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Every runner gets the same shell. Without this, Windows steps run under pwsh,
# which mangles native-command arguments containing "=" - `-coverprofile=x.out`
# arrives at go as two arguments and the job fails on a package named ".out".
# One shell across the matrix also keeps $(...) and [ ] working everywhere.
defaults:
  run:
    shell: bash

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: "1.22"
          check-latest: true
      - name: go vet
        run: go vet ./...
      - name: gofmt
        if: matrix.os == 'ubuntu-latest'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::these files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: test
        run: go test -race -coverprofile=coverage.out ./...
      - name: coverage summary
        if: matrix.os == 'ubuntu-latest'
        run: go tool cover -func=coverage.out | tail -1

  rules:
    name: rule packs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: "1.22"
      - name: every builtin rule compiles and is documented
        run: go run ./cmd/threatdiff rules list > /dev/null
      - name: the rule reference is up to date
        run: |
          go run ./cmd/threatdiff rules docs --out /tmp/rules.md
          if ! diff -u docs/rules.md /tmp/rules.md; then
            echo "::error::docs/rules.md is stale. Run: make docs"
            exit 1
          fi

  dogfood:
    name: threatdiff on threatdiff
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: threatdiff
        uses: ./
        with:
          version: source
          fail-on: critical
      - uses: github/codeql-action/upload-sarif@v3
        if: always() && steps.threatdiff.outputs.sarif-file != ''
        with:
          sarif_file: ${{ steps.threatdiff.outputs.sarif-file }}
          category: threatdiff
