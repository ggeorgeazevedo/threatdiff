version: 1
name: secrets
description: >
  Credentials appearing in a diff. Matched text is never echoed back verbatim -
  every rule here is marked `redact`, so a PR comment cannot become the second
  place the secret leaks.

rules:
  - id: secret.private-key-block
    title: Private key material committed
    category: secrets
    severity: critical
    confidence: high
    on: added
    redact: true
    patterns:
      - '-----BEGIN (RSA |DSA |EC |OPENSSH |PGP |ENCRYPTED )?PRIVATE KEY-----'
      - '(?i)PuTTY-User-Key-File-\d'
    question: >
      Which systems trust this key, and has it been revoked yet?
    guidance: |
      Treat the key as public from the moment the commit existed on any machine.
      Rotate first, then remove it from history. Deleting the file in a follow-up
      commit does not remove it: the blob is still reachable by SHA, and on
      GitHub it stays reachable through the fork network even after a force-push.
    cwe: ["CWE-798"]

  - id: secret.cloud-provider-credential
    title: Cloud provider credential committed
    category: secrets
    severity: critical
    confidence: high
    on: added
    redact: true
    patterns:
      - '\b(A3T[A-Z0-9]|AKIA|ABIA|ACCA|ASIA)[A-Z0-9]{16}\b'
      - '(?i)aws_?secret_?access_?key\s*[:=]\s*["'']?[A-Za-z0-9/+=]{40}'
      - '(?i)AIza[0-9A-Za-z\-_]{35}'
      - '(?i)"type"\s*:\s*"service_account"'
      - '(?i)(azure|client)_?secret\s*[:=]\s*["''][A-Za-z0-9~._\-]{30,}["'']'
      - '(?i)DefaultEndpointsProtocol=https;AccountName=[^;]+;AccountKey='
    question: >
      What can this identity do, and has it been disabled?
    guidance: |
      Revoke before you clean up. Then check the provider's audit trail
      (CloudTrail, Cloud Audit Logs, Azure Activity Log) for use of the
      credential between the commit timestamp and revocation - public repository
      keys are typically exercised within minutes of being pushed.
      Longer term, prefer workload identity federation over static keys so there
      is nothing to leak.
    cwe: ["CWE-798"]

  - id: secret.service-token
    title: Service access token committed
    category: secrets
    severity: critical
    confidence: high
    on: added
    redact: true
    patterns:
      - '\bgh[pousr]_[A-Za-z0-9]{36,}\b'
      - '\bgithub_pat_[A-Za-z0-9_]{22,}\b'
      - '\bxox[baprs]-[A-Za-z0-9\-]{10,}\b'
      - '\b(sk|rk)_(live|test)_[A-Za-z0-9]{16,}\b'
      - '\bglpat-[A-Za-z0-9\-_]{20,}\b'
      - '\bnpm_[A-Za-z0-9]{36}\b'
      - '\bdop_v1_[a-f0-9]{64}\b'
      - '\bSG\.[A-Za-z0-9_\-]{22}\.[A-Za-z0-9_\-]{43}\b'
      - '(?i)\bBearer\s+[A-Za-z0-9\-_]{20,}\.[A-Za-z0-9\-_]{20,}\.[A-Za-z0-9\-_]{20,}'
    question: >
      Which account does this token belong to, what scopes does it carry, and has
      it been revoked?
    guidance: |
      Revoke, then rotate anything the token could have reached. Note the scopes:
      a token with `repo` on a personal account often reaches far more than the
      repository it was committed to.
    cwe: ["CWE-798"]

  - id: secret.connection-string-with-password
    title: Connection string containing an inline password
    category: secrets
    severity: high
    confidence: high
    on: added
    redact: true
    exclude_paths:
      - "**/test/**"
      - "**/tests/**"
      - "**/*.example*"
      - "**/*.sample*"
    patterns:
      - '(?i)(postgres(ql)?|mysql|mongodb(\+srv)?|redis|rediss|amqp|mssql|ldap|ftp|sftp)://[^:\s/@]+:[^@\s]{3,}@'
      - '(?i)(Password|Pwd)\s*=\s*[^;\s"'']{4,}\s*;'
    exclude_patterns:
      - '(?i)://[^:\s/@]+:(password|changeme|example|xxx+|\*+|\$\{|<|\.\.\.)'
    question: >
      Is this a real environment or a local compose file?
    guidance: |
      Local development credentials in a compose file are noise; the same string
      in a Helm values file, a Terraform variable or an application config is a
      finding. Check where the file is deployed from before you decide.
      Where it is real, move the credential to a secret store and rotate the
      database user.
    cwe: ["CWE-798"]

  - id: secret.generic-credential-assignment
    title: Credential-shaped value assigned to a variable
    category: secrets
    severity: high
    confidence: low
    on: added
    redact: true
    exclude_paths:
      - "**/test/**"
      - "**/tests/**"
      - "**/*.test.*"
      - "**/*.spec.*"
      - "**/fixtures/**"
      - "**/*.example*"
      - "**/*.sample*"
      - "**/*.md"
      - "**/*.lock"
    patterns:
      - '(?i)\b(api_?key|apikey|access_?token|auth_?token|secret|client_?secret|password|passwd|private_?token|session_?key|webhook_?url)\w*\s*[:=]\s*["''][^"''\s$<{]{12,}["'']'
    exclude_patterns:
      - '(?i)["''](\$\{|%\(|<%=|\{\{|process\.env|os\.environ|ENV\[|null|none|changeme|placeholder|redacted|xxx|your[_\-]|example|dummy|test|fake|sample)'
      - '(?i)[:=]\s*["''][a-z_]+(\.[a-z_]+)+["'']\s*$'
    question: >
      Is this a real credential, or a variable name, URL fragment or placeholder?
    guidance: |
      This rule is deliberately broad and will produce false positives; that is
      the correct trade-off for credentials. If it is a placeholder, suppress it
      with an inline `threatdiff:ignore` comment naming why, or add the path to
      `exclude_paths` in your own rule pack so the next reviewer is not asked
      again.
    cwe: ["CWE-798"]

  - id: secret.env-file-added
    title: Environment file added to the repository
    category: secrets
    severity: high
    confidence: medium
    on: file
    file_events: ["created", "renamed"]
    paths:
      - "**/.env"
      - "**/.env.*"
      - "**/*.pem"
      - "**/*.p12"
      - "**/*.pfx"
      - "**/*.jks"
      - "**/*.keystore"
      - "**/id_rsa"
      - "**/id_ed25519"
      - "**/.npmrc"
      - "**/.pypirc"
      - "**/.netrc"
      - "**/credentials"
      - "**/service-account*.json"
    exclude_paths:
      - "**/.env.example"
      - "**/.env.sample"
      - "**/.env.template"
      - "**/.env.dist"
    question: >
      Does this file contain real values, and should it be in .gitignore instead?
    guidance: |
      The convention is to commit `.env.example` with empty or obviously fake
      values and to ignore `.env` itself. Certificate and keystore files follow
      the same rule: public certificates are fine to commit, anything holding a
      private key is not.
    cwe: ["CWE-538"]

  - id: secret.logged-or-printed
    title: Credential written to logs or standard output
    category: information-disclosure
    severity: high
    confidence: medium
    on: added
    patterns:
      - '(?i)(print|println|console\.(log|info|debug|error|warn)|log(ger)?\.(debug|info|warn|error|trace)|fmt\.(Print|Sprint)\w*|System\.out\.print\w*|puts|echo|var_dump)\s*\([^\n)]*\b(password|passwd|secret|token|api_?key|credential|authorization|cookie|session_?id|private_?key|ssn|card_?number)\b'
      - '(?i)(log|logger)[^\n]*\{[^\n]*(password|token|secret|authorization)[^\n]*\}'
    question: >
      Where do these logs end up, and who can read them?
    guidance: |
      Application logs are routinely shipped to a third-party platform, retained
      for a year and readable by the whole engineering organisation. A secret in
      a log is a secret shared with all of that.
      Log an identifier instead of the value, or add the field to your logger's
      redaction list. Watch out for the indirect version: logging an entire
      request, config struct or exception object usually drags credentials along
      with it.
    cwe: ["CWE-532"]
    owasp: ["A09:2021 Security Logging and Monitoring Failures"]
